name: dns-assistant
services:
  app:
    image: ghcr.io/leoskey/dns-assistant:latest
    ports:
      - "0.0.0.0:53:5353/udp"
      - "0.0.0.0:53:5353/tcp"
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:8082:8082"
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "dns-assistant", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  data:
