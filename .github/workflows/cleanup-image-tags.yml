name: Clean legacy image tags

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove legacy tags while preserving release digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${REPOSITORY,,}"
          image="ghcr.io/$repository"
          owner="${repository%%/*}"
          package="${repository#*/}"
          api="users/$owner/packages/container/$package/versions"
          gh api --paginate --slurp "$api?per_page=100" | jq 'add' > "$RUNNER_TEMP/versions.json"
          jq '[.[] | .name as $digest | .metadata.container.tags[] | select(. == "latest" or test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) | {tag: ., digest: $digest}]' "$RUNNER_TEMP/versions.json" > "$RUNNER_TEMP/retained.json"
          mapfile -t tags < <(jq -r '.[].metadata.container.tags[] | select(. != "latest" and (test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$") | not))' "$RUNNER_TEMP/versions.json")
          if (( ${#tags[@]} == 0 )); then
            echo 'No legacy tags found.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source=$(jq -er '.[] | select(.tag == "latest") | .digest' "$RUNNER_TEMP/retained.json")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$image:$tag"); done
          docker buildx imagetools create --annotation "index:io.dns-assistant.tag-cleanup=$GITHUB_RUN_ID" "${args[@]}" "$image@$source"
          digest=$(docker buildx imagetools inspect "$image:${tags[0]}" --format '{{.Manifest.Digest}}')
          jq -e --arg digest "$digest" 'all(.[]; .name != $digest)' "$RUNNER_TEMP/versions.json"
          while IFS=$'\t' read -r tag expected; do
            actual=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')
            test "$actual" = "$expected"
          done < <(jq -r '.[] | [.tag, .digest] | @tsv' "$RUNNER_TEMP/retained.json")
          gh api --paginate --slurp "$api?per_page=100" | jq 'add' > "$RUNNER_TEMP/after-move.json"
          id=$(jq -er --arg digest "$digest" '.[] | select(.name == $digest) | select(all(.metadata.container.tags[]; . != "latest" and (test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$") | not))) | .id' "$RUNNER_TEMP/after-move.json")
          gh api --method DELETE "$api/$id"
          gh api --paginate --slurp "$api?per_page=100" | jq 'add' > "$RUNNER_TEMP/final.json"
          jq -e 'all(.[].metadata.container.tags[]; . == "latest" or test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' "$RUNNER_TEMP/final.json"
          while IFS=$'\t' read -r tag expected; do
            actual=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')
            test "$actual" = "$expected"
            echo "$tag: $actual" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.tag, .digest] | @tsv' "$RUNNER_TEMP/retained.json")
          printf '\nRemoved %s legacy tags; retained release digests are unchanged.\n' "${#tags[@]}" >> "$GITHUB_STEP_SUMMARY"
