name: Application release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Build and test React
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          npm test --prefix web
      - name: Check automatic server address
        run: npm run test:server-ip
      - name: Check release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          npm run test:version
          npm run version:check
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...

  windows:
    name: Windows x64 installer and portable package
    needs: test
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Build Windows packages
        shell: powershell
        run: ./scripts/package-windows.ps1
      - name: Test Windows lifecycle and installer
        shell: powershell
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-windows-package.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dns-assistant-windows-amd64
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*-setup.exe
            artifacts/releases/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish amd64 and arm64
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_NAME=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.test.outputs.version }},priority=1000,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=dns-assistant
          cache-to: type=gha,scope=dns-assistant,mode=max
          provenance: mode=min
          build-args: |
            VCS_REF=${{ github.sha }}
      - name: Verify manifest and run both architectures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          APP_VERSION: ${{ needs.test.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          image="$IMAGE_NAME@$DIGEST"
          if [[ "$RELEASE_REF" == refs/heads/main || "$RELEASE_REF" == refs/tags/v* ]]; then
            docker buildx imagetools inspect "$IMAGE_NAME:$APP_VERSION" --format '{{.Manifest.Digest}}' | grep -Fx "$DIGEST"
          fi
          manifest="$RUNNER_TEMP/image-manifest.json"
          docker buildx imagetools inspect "$image" --raw > "$manifest"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' "$manifest"
          # Classic Docker stores cannot keep two platforms under one index digest.
          for platform in linux/amd64 linux/arm64; do
            platform_digest=$(jq -er --arg arch "${platform#linux/}" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' "$manifest")
            docker run --rm --network none --platform "$platform" "$IMAGE_NAME@$platform_digest" config | jq -e '.rules | length > 0'
            docker run --rm --network none --platform "$platform" "$IMAGE_NAME@$platform_digest" version | grep -Fx "DNS Assistant v$APP_VERSION ($SOURCE_REVISION)"
            docker image inspect "$IMAGE_NAME@$platform_digest" --format '{{index .Config.Labels "org.opencontainers.image.version"}}' | grep -Fx "$APP_VERSION"
          done
          {
            echo '### Published Docker image'
            echo "Image: \`$IMAGE_NAME\`"
            echo "Digest: \`$DIGEST\`"
            echo "Version: \`$APP_VERSION\`"
            echo 'Platforms: linux/amd64, linux/arm64'
            echo 'Both platform binaries passed the config and version command smoke tests.'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dns-assistant-windows-amd64
          path: artifacts/release
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          (cd artifacts/release && sha256sum --check SHA256SUMS)
          cp "docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          printf '\nDocker image digest: `%s`\n' "$IMAGE_DIGEST" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "DNS Assistant $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" artifacts/release/*.zip artifacts/release/*-setup.exe artifacts/release/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
